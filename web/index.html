<title>AppInstaller Generator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Wybierz aplikacje i pobierz jeden instalator, który zainstaluje najnowsze wersje.">
<style>
/* Układ: jak aplikacja Windows 11 — panel kategorii na tle "Mica", treść na zaokrąglonej warstwie, pasek akcji przyklejony u dołu. */
:root {
  --bg: #eef0f3;
  --mica-a: #dfe7f1;
  --mica-b: #f1ecf3;
  --layer: rgba(255,255,255,.62);
  --layer-stroke: rgba(0,0,0,.06);
  --card: rgba(255,255,255,.78);
  --card-hover: rgba(255,255,255,.96);
  --stroke: rgba(0,0,0,.07);
  --stroke-strong: rgba(0,0,0,.16);
  --fg: rgba(0,0,0,.89);
  --fg-2: rgba(0,0,0,.62);
  --fg-3: rgba(0,0,0,.45);
  --hover: rgba(0,0,0,.04);
  --accent: #005fb8;
  --accent-hover: #1a6fc0;
  --on-accent: #ffffff;
  --accent-soft: rgba(0,95,184,.10);
  --ok: #0f7b0f;
  --ok-bg: #dff6dd;
  --flyout: #fbfbfb;
  --shadow: 0 8px 24px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --r-control: 4px;
  --r-card: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1c; --mica-a: #20242b; --mica-b: #241f26;
    --layer: rgba(58,58,58,.30); --layer-stroke: rgba(0,0,0,.25);
    --card: rgba(255,255,255,.05); --card-hover: rgba(255,255,255,.085);
    --stroke: rgba(255,255,255,.07); --stroke-strong: rgba(255,255,255,.22);
    --fg: #ffffff; --fg-2: rgba(255,255,255,.77); --fg-3: rgba(255,255,255,.53);
    --hover: rgba(255,255,255,.06);
    --accent: #60cdff; --accent-hover: #5bbbe8; --on-accent: #000000; --accent-soft: rgba(96,205,255,.12);
    --ok: #6ccb5f; --ok-bg: rgba(108,203,95,.14); --flyout: #2c2c2c;
    --shadow: 0 8px 24px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1c1c; --mica-a: #20242b; --mica-b: #241f26;
  --layer: rgba(58,58,58,.30); --layer-stroke: rgba(0,0,0,.25);
  --card: rgba(255,255,255,.05); --card-hover: rgba(255,255,255,.085);
  --stroke: rgba(255,255,255,.07); --stroke-strong: rgba(255,255,255,.22);
  --fg: #ffffff; --fg-2: rgba(255,255,255,.77); --fg-3: rgba(255,255,255,.53);
  --hover: rgba(255,255,255,.06);
  --accent: #60cdff; --accent-hover: #5bbbe8; --on-accent: #000000; --accent-soft: rgba(96,205,255,.12);
  --ok: #6ccb5f; --ok-bg: rgba(108,203,95,.14); --flyout: #2c2c2c;
  --shadow: 0 8px 24px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font: 14px/1.43 var(--font); color: var(--fg);
  background: var(--bg);
  background-image: radial-gradient(1200px 700px at 0% 0%, var(--mica-a), transparent 60%),
                    radial-gradient(900px 600px at 100% 100%, var(--mica-b), transparent 60%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 4px; }

.app { display: grid; grid-template-rows: auto 1fr; min-height: 100%; }
header.top {
  display: grid; grid-template-columns: 240px 1fr auto; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; flex: none; }
.logo svg { width: 16px; height: 16px; fill: var(--on-accent); }
.brand b { font-weight: 600; white-space: nowrap; }
.brand small { color: var(--fg-3); font-size: 12px; margin-left: 2px; }

.search { position: relative; max-width: 420px; width: 100%; justify-self: center; }
.search input {
  width: 100%; height: 34px; padding: 0 34px 0 11px; border-radius: var(--r-control);
  border: 1px solid var(--stroke); border-bottom-color: var(--stroke-strong); background: var(--card); outline: none;
}
.search input:focus { background: var(--card-hover); border-bottom: 2px solid var(--accent); padding-bottom: 1px; }
.search svg { position: absolute; right: 11px; top: 10px; width: 14px; height: 14px; fill: var(--fg-2); pointer-events: none; }

.tools { display: flex; gap: 4px; }
.subtle { height: 34px; min-width: 38px; padding: 0 10px; border: 0; border-radius: var(--r-control); background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
.subtle:hover { background: var(--hover); }
.subtle svg { width: 16px; height: 16px; fill: currentColor; }

.body { display: grid; grid-template-columns: 240px 1fr; min-height: 0; }
nav.cats { padding: 4px 8px 16px max(8px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 2px; }
.cat { position: relative; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px 0 14px; border: 0; background: none; border-radius: var(--r-control); cursor: pointer; text-align: left; }
.cat:hover { background: var(--hover); }
.cat[aria-pressed="true"] { background: var(--hover); }
.cat[aria-pressed="true"]::before { content: ""; position: absolute; left: 0; top: 10px; width: 3px; height: 16px; border-radius: 2px; background: var(--accent); }
.cat span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat em { font-style: normal; color: var(--fg-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.nav-foot { margin-top: auto; padding: 16px 14px 0; color: var(--fg-3); font-size: 12px; line-height: 1.5; }

main.layer {
  background: var(--layer); border: 1px solid var(--layer-stroke); border-right: 0; border-bottom: 0;
  border-radius: 8px 0 0 0; display: flex; flex-direction: column; min-width: 0;
  backdrop-filter: blur(30px) saturate(1.2); -webkit-backdrop-filter: blur(30px) saturate(1.2);
}
.content { padding: 20px max(20px, env(safe-area-inset-right, 0px)) 24px 20px; display: flex; flex-direction: column; gap: 22px; flex: 1; }
.intro h1 { font: 600 28px/1.25 var(--font-display); margin: 0 0 4px; text-wrap: balance; letter-spacing: -.01em; }
.intro p { margin: 0; color: var(--fg-2); max-width: 68ch; }

section h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
section h2 svg { width: 14px; height: 14px; fill: currentColor; }
section .hint { margin: 0 0 10px; color: var(--fg-2); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }

.card {
  display: grid; grid-template-columns: 32px 1fr 20px; gap: 12px; align-items: start; text-align: left;
  padding: 12px; min-height: 84px; border-radius: var(--r-card); border: 1px solid var(--stroke);
  background: var(--card); cursor: pointer; width: 100%; transition: background .12s, border-color .12s;
}
.card:hover { background: var(--card-hover); }
.card[aria-checked="true"] { border-color: var(--accent); }
.card.core { cursor: default; }
.card.core:hover { background: var(--card); }
.ico { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 15px; position: relative; overflow: hidden; }
.ico img { position: absolute; inset: 0; width: 100%; height: 100%; padding: 4px; background: var(--flyout); object-fit: contain; }
.meta { min-width: 0; }
.meta b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta p { margin: 3px 0 0; color: var(--fg-2); font-size: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.src { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
.src span { font: 11px/1.5 var(--mono); color: var(--fg-3); border: 1px solid var(--stroke); border-radius: 3px; padding: 0 5px; }
.check { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--fg-3); display: grid; place-items: center; margin-top: 2px; background: var(--card); }
.check svg { width: 12px; height: 12px; fill: var(--on-accent); opacity: 0; }
.card[aria-checked="true"] .check { background: var(--accent); border-color: var(--accent); }
.card[aria-checked="true"] .check svg { opacity: 1; }
.lock svg { width: 14px; height: 14px; fill: var(--fg-3); margin-top: 4px; }
.empty { color: var(--fg-2); text-align: center; padding: 32px 0; }

.bar {
  position: sticky; bottom: 0; z-index: 5; border-top: 1px solid var(--stroke);
  background: var(--flyout); box-shadow: 0 -8px 24px rgba(0,0,0,.04);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
}
.count { font-weight: 600; font-variant-numeric: tabular-nums; }
.count small { display: block; font-weight: 400; color: var(--fg-2); font-size: 12px; }
.cli { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 6px; }
.cli code { flex: 1; min-width: 0; font: 12px/1.4 var(--mono); color: var(--fg-2); background: var(--hover); border: 1px solid var(--stroke); border-radius: var(--r-control); padding: 7px 9px; overflow-x: auto; white-space: nowrap; }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { height: 32px; padding: 0 12px; border-radius: var(--r-control); border: 1px solid var(--stroke); border-bottom-color: var(--stroke-strong); background: var(--card); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { background: var(--card-hover); }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.btn.accent { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; padding: 0 16px; }
.btn.accent:hover { background: var(--accent-hover); }
.btn:disabled { opacity: .5; cursor: progress; }
select.mode { height: 32px; border-radius: var(--r-control); border: 1px solid var(--stroke); background: var(--card); padding: 0 8px; max-width: 100%; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(520px, calc(100% - 32px));
  background: var(--flyout); border: 1px solid var(--stroke); box-shadow: var(--shadow); border-radius: var(--r-card); padding: 12px 16px; z-index: 20; }
.toast b { display: block; margin-bottom: 2px; }
.toast span { color: var(--fg-2); font-size: 13px; }

@media (max-width: 820px) {
  header.top { grid-template-columns: 1fr auto; }
  .search { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; max-width: none; }
  .body { grid-template-columns: 1fr; }
  nav.cats { flex-direction: row; overflow-x: auto; padding: 0 16px 10px; gap: 4px; }
  .cat { flex: none; height: 32px; border: 1px solid var(--stroke); background: var(--card); }
  .cat[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .cat[aria-pressed="true"]::before { display: none; }
  .nav-foot { display: none; }
  main.layer { border-radius: 8px 8px 0 0; border-right: 1px solid var(--layer-stroke); }
  .content { padding: 16px; }
  .bar { padding-left: 16px; padding-right: 16px; }
  .grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 16 16"><path d="M7.3 1.5h1.4v7.3l2.6-2.6 1 1L8 11.5 3.7 7.2l1-1 2.6 2.6zM3 13h10v1.5H3z"/></svg></div>
      <b>AppInstaller</b><small id="ver"></small>
    </div>
    <label class="search">
      <input id="q" type="search" autocomplete="off" data-i18n-ph="search">
      <svg viewBox="0 0 16 16"><path d="M6.5 1a5.5 5.5 0 0 1 4.38 8.82l3.65 3.65-1.06 1.06-3.65-3.65A5.5 5.5 0 1 1 6.5 1zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>
    </label>
    <div class="tools">
      <button class="subtle" id="lang" type="button"><svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm2.4 7.7H5.6c.1 2.3 1.1 4.3 2.4 4.8 1.3-.5 2.3-2.5 2.4-4.8zm3.5 0h-2.1c-.1 1.8-.6 3.4-1.4 4.4a5.6 5.6 0 0 0 3.5-4.4zm-9.7 0H2.1a5.6 5.6 0 0 0 3.5 4.4c-.8-1-1.3-2.6-1.4-4.4zM5.6 2.9A5.6 5.6 0 0 0 2.1 7.3h2.1c.1-1.8.6-3.4 1.4-4.4zM8 2.5c-1.3.5-2.3 2.5-2.4 4.8h4.8C10.3 5 9.3 3 8 2.5zm2.4.4c.8 1 1.3 2.6 1.4 4.4h2.1a5.6 5.6 0 0 0-3.5-4.4z"/></svg><span id="langTxt">PL</span></button>
      <button class="subtle" id="theme" type="button"><svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 1 0 14V1z"/><path d="M8 1a7 7 0 0 0 0 14v-1.5a5.5 5.5 0 0 1 0-11z"/></svg></button>
    </div>
  </header>

  <div class="body">
    <nav class="cats" id="cats" aria-label="Kategorie"></nav>
    <main class="layer">
      <div class="content">
        <div class="intro">
          <h1 data-i18n="h1"></h1>
          <p data-i18n="lead"></p>
        </div>
        <section id="coreSec">
          <h2><svg viewBox="0 0 16 16"><path d="M8 1a3.5 3.5 0 0 1 3.5 3.5V6H12a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h.5V4.5A3.5 3.5 0 0 1 8 1zm0 1.5a2 2 0 0 0-2 2V6h4V4.5a2 2 0 0 0-2-2z"/></svg><span data-i18n="core"></span></h2>
          <p class="hint" data-i18n="coreHint"></p>
          <div class="grid" id="coreGrid"></div>
        </section>
        <section id="appSec">
          <h2 id="secTitle"></h2>
          <div class="grid" id="appGrid"></div>
          <p class="empty" id="empty" hidden data-i18n="empty"></p>
        </section>
      </div>
      <div class="bar">
        <div class="count" id="count"></div>
        <div class="cli"><code id="cli"></code><button class="btn" id="copy" type="button" data-i18n-title="copy"><svg viewBox="0 0 16 16"><path d="M5 1h7a2 2 0 0 1 2 2v8h-1.5V3a.5.5 0 0 0-.5-.5H5zM3 4h6a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm.5 1.5v8h5v-8z"/></svg></button></div>
        <div class="actions">
          <select class="mode" id="mode" aria-label="Tryb">
            <option value="payload" data-i18n="modePayload"></option>
            <option value="name" data-i18n="modeName"></option>
          </select>
          <button class="btn" id="clear" type="button" data-i18n="clear"></button>
          <button class="btn accent" id="dl" type="button"><svg viewBox="0 0 16 16"><path d="M7.3 1.5h1.4v7.3l2.6-2.6 1 1L8 11.5 3.7 7.2l1-1 2.6 2.6zM3 13h10v1.5H3z"/></svg><span id="dlTxt"></span></button>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"><b id="toastT"></b><span id="toastB"></span></div>

<script>
(() => {
  "use strict";
  const T = {
    pl: { search: "Szukaj aplikacji", h1: "Wybierz aplikacje, pobierz jeden instalator",
      lead: "Instalator pobierze najnowsze wersje prosto od wydawców (z awaryjnym winget i Chocolatey) i zainstaluje je po cichu, bez pytań i bez dodatków.",
      core: "Zawsze instalowane", coreHint: "Biblioteki potrzebne większości programów. Dołączane do każdego instalatora.",
      all: "Wszystkie", empty: "Brak aplikacji pasujących do wyszukiwania.", clear: "Wyczyść",
      copy: "Kopiuj polecenie", copied: "Skopiowano polecenie",
      modePayload: "Wybór w pliku", modeName: "Wybór w nazwie pliku",
      count: n => `Wybrano: ${n}`, base: n => `+ ${n} pakietów bazowych`, dl: "Pobierz instalator",
      building: "Przygotowywanie…", ready: "Instalator gotowy", readyB: f => `Zapisano ${f}. Uruchom go jako administrator.`,
      demoT: "Podgląd", demoB: f => `Na GitHub Pages w tym miejscu pobrałby się plik ${f}.`,
      errT: "Nie udało się przygotować instalatora", errB: "Nie można pobrać AppInstaller.exe z tej strony. Odśwież stronę i spróbuj ponownie.",
      catalog: (n, d) => `${n} aplikacji · katalog z ${d}` },
    en: { search: "Search apps", h1: "Pick your apps, get one installer",
      lead: "The installer downloads the latest versions straight from vendors (falling back to winget and Chocolatey) and installs them silently, with no prompts and no bundled extras.",
      core: "Always installed", coreHint: "Runtimes most programs need. Included in every installer.",
      all: "All apps", empty: "No apps match your search.", clear: "Clear",
      copy: "Copy command", copied: "Command copied",
      modePayload: "Selection inside file", modeName: "Selection in file name",
      count: n => `Selected: ${n}`, base: n => `+ ${n} base runtimes`, dl: "Download installer",
      building: "Preparing…", ready: "Installer ready", readyB: f => `Saved ${f}. Run it as administrator.`,
      demoT: "Preview", demoB: f => `On GitHub Pages this would download ${f}.`,
      errT: "Couldn't prepare the installer", errB: "AppInstaller.exe couldn't be loaded from this site. Reload the page and try again.",
      catalog: (n, d) => `${n} apps · catalog from ${d}` }
  };
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const $ = id => document.getElementById(id);
  let lang = store.get("lang") || ((navigator.language || "en").toLowerCase().startsWith("pl") ? "pl" : "en");
  let cat = null, catId = "*", sel = new Set(), demo = false;

  const palette = ["#0067C0", "#8764B8", "#038387", "#CA5010", "#498205", "#C239B3", "#0078D4", "#567C73"];
  const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 17);
  const loc = d => !d ? "" : (d[lang] || d.en || d.pl || Object.values(d)[0] || "");
  const t = k => T[lang][k];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // Ikona: własna z repo (icons/<id>.png), potem wpisy "icons" (URL lub "@domena"), na końcu monogram
  const iconUrls = a => {
    const list = demo ? [] : [`icons/${a.id}.png`];
    for (const e of [...(a.icons || []), ...(a.icon ? [a.icon] : [])]) {
      if (!e) continue;
      list.push(e[0] === "@" ? cat.iconService.replace("{0}", e.slice(1)) : e);
    }
    return [...new Set(list)];
  };
  window.__nextIcon = img => {
    const rest = (img.dataset.next || "").split("|").filter(Boolean);
    if (!rest.length) { img.remove(); return; }
    img.dataset.next = rest.slice(1).join("|");
    img.src = rest[0];
  };
  const isCore = a => cat.core.includes(a.id);
  const sources = a => [...new Set(a.sources.map(s => ["winget", "choco"].includes(s.type) ? s.type : "direct"))];

  async function load() {
    try {
      const r = await fetch("apps.json", { cache: "no-cache" });
      if (!r.ok) throw 0;
      cat = await r.json();
    } catch {
      const el = document.getElementById("demo-catalog");
      cat = el ? JSON.parse(el.textContent) : { apps: [], core: [], categories: [] };
      demo = true;
    }
    const fromHash = decodeURIComponent(location.hash.slice(1)).split(/[.+,]/).filter(id => cat.apps.some(a => a.id === id));
    fromHash.forEach(id => sel.add(id));
    if (!fromHash.length && demo) ["firefox", "7zip", "vlc", "notepadpp", "keepassxc"].forEach(id => sel.add(id));
    render();
  }

  function card(a) {
    const core = isCore(a), on = core || sel.has(a.id), urls = iconUrls(a), u = urls[0];
    const mono = esc((a.name.replace(/^\./, "")[0] || "?").toUpperCase());
    return `<button type="button" class="card${core ? " core" : ""}" role="checkbox" aria-checked="${on}" ${core ? 'aria-disabled="true"' : ""} data-id="${esc(a.id)}">
      <span class="ico" style="background:${palette[Math.abs(hash(a.id)) % palette.length]}">${mono}${u ? `<img alt="" loading="lazy" src="${esc(u)}" data-next="${esc(urls.slice(1).join("|"))}" onerror="__nextIcon(this)">` : ""}</span>
      <span class="meta"><b>${esc(a.name)}</b><p>${esc(loc(a.desc))}</p>
        <span class="src">${sources(a).map(s => `<span>${s}</span>`).join("")}</span></span>
      ${core ? `<span class="lock"><svg viewBox="0 0 16 16"><path d="M8 1a3.5 3.5 0 0 1 3.5 3.5V6H12a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h.5V4.5A3.5 3.5 0 0 1 8 1zm0 1.5a2 2 0 0 0-2 2V6h4V4.5a2 2 0 0 0-2-2z"/></svg></span>`
             : `<span class="check"><svg viewBox="0 0 16 16"><path d="M13.3 3.3 6 10.6 2.7 7.3 1.6 8.4 6 12.8l8.4-8.4z"/></svg></span>`}
    </button>`;
  }

  function render() {
    document.documentElement.lang = lang;
    $("langTxt").textContent = lang.toUpperCase();
    document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
    document.querySelectorAll("[data-i18n-ph]").forEach(e => e.placeholder = t(e.dataset.i18nPh));
    document.querySelectorAll("[data-i18n-title]").forEach(e => e.title = t(e.dataset.i18nTitle));
    const nonCore = cat.apps.filter(a => !isCore(a));
    const cats = [{ id: "*", name: t("all"), n: nonCore.length },
      ...cat.categories.map(c => ({ id: c.id, name: loc(c.name), n: cat.apps.filter(a => a.category === c.id).length })).filter(c => c.n)];
    $("cats").innerHTML = cats.map(c => `<button type="button" class="cat" aria-pressed="${c.id === catId}" data-cat="${c.id}"><span>${esc(c.name)}</span><em>${c.n}</em></button>`).join("")
      + `<div class="nav-foot">${esc(t("catalog")(cat.apps.length, cat.updated || "—"))}</div>`;
    const q = $("q").value.trim().toLowerCase();
    const match = a => (catId === "*" || a.category === catId) &&
      (!q || a.name.toLowerCase().includes(q) || a.id.includes(q) || loc(a.desc).toLowerCase().includes(q));
    const core = cat.apps.filter(a => isCore(a) && match(a));
    const apps = nonCore.filter(match).sort((x, y) => x.name.localeCompare(y.name));
    $("coreSec").hidden = !core.length;
    $("coreGrid").innerHTML = core.map(card).join("");
    $("appGrid").innerHTML = apps.map(card).join("");
    $("secTitle").textContent = cats.find(c => c.id === catId)?.name || "";
    $("secTitle").hidden = !apps.length;
    $("empty").hidden = core.length + apps.length > 0;
    updateBar();
  }

  function ids() { return cat.apps.filter(a => sel.has(a.id) && !isCore(a)).map(a => a.id); }
  function fileName() {
    const list = ids();
    return $("mode").value === "name" ? `AppInstaller[${list.join("+") || "base"}].exe` : `AppInstaller-${list.length}apps.exe`;
  }
  function updateBar() {
    const list = ids();
    $("count").innerHTML = `${esc(t("count")(list.length))}<small>${esc(t("base")(cat.core.length))}</small>`;
    $("cli").textContent = list.length ? `AppInstaller.exe --apps ${list.join(",")}` : "AppInstaller.exe --preset minimal";
    $("dlTxt").textContent = t("dl");
    if (!demo) history.replaceState(null, "", list.length ? "#" + list.join(".") : location.pathname);
  }

  let toastTimer;
  function toast(title, body) {
    $("toastT").textContent = title; $("toastB").textContent = body; $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").hidden = true, 5000);
  }

  // Doklejenie wyboru do exe: [JSON][int32 LE długość]["AIPAYLD1"] — format czytany przez Core/Payload.cs
  async function build() {
    const name = fileName();
    if (demo) { toast(t("demoT"), t("demoB")(name)); return; }
    const btn = $("dl"); btn.disabled = true; $("dlTxt").textContent = t("building");
    try {
      const r = await fetch("AppInstaller.exe", { cache: "no-cache" });
      if (!r.ok) throw new Error(r.status);
      const base = new Uint8Array(await r.arrayBuffer());
      let parts = [base];
      if ($("mode").value === "payload") {
        const json = new TextEncoder().encode(JSON.stringify({ v: 1, apps: ids(), lang }));
        const tail = new Uint8Array(12);
        new DataView(tail.buffer).setUint32(0, json.length, true);
        tail.set(new TextEncoder().encode("AIPAYLD1"), 4);
        parts = [base, json, tail];
      }
      const url = URL.createObjectURL(new Blob(parts, { type: "application/octet-stream" }));
      const a = Object.assign(document.createElement("a"), { href: url, download: name });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      toast(t("ready"), t("readyB")(name));
    } catch {
      toast(t("errT"), t("errB"));
    } finally { btn.disabled = false; $("dlTxt").textContent = t("dl"); }
  }

  // ===== zdarzenia =====
  document.addEventListener("click", e => {
    const c = e.target.closest(".card");
    if (c && !c.classList.contains("core")) {
      const id = c.dataset.id;
      sel.has(id) ? sel.delete(id) : sel.add(id);
      c.setAttribute("aria-checked", sel.has(id)); updateBar(); return;
    }
    const k = e.target.closest(".cat");
    if (k) { catId = k.dataset.cat; render(); }
  });
  $("q").addEventListener("input", render);
  $("clear").addEventListener("click", () => { sel.clear(); render(); });
  $("mode").addEventListener("change", () => store.set("mode", $("mode").value));
  $("mode").value = store.get("mode") || "payload";
  $("dl").addEventListener("click", build);
  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("cli").textContent); toast(t("copied"), $("cli").textContent); }
    catch { const r = document.createRange(); r.selectNodeContents($("cli")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  });
  $("lang").addEventListener("click", () => { lang = lang === "pl" ? "en" : "pl"; store.set("lang", lang); render(); });
  const themes = ["auto", "light", "dark"];
  let theme = store.get("theme") || "auto";
  const applyTheme = () => {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    $("theme").title = { auto: "Motyw: systemowy / System theme", light: "Motyw: jasny / Light", dark: "Motyw: ciemny / Dark" }[theme];
  };
  $("theme").addEventListener("click", () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; store.set("theme", theme); applyTheme(); });
  applyTheme();
  load();
})();
</script>
