name: Build & publish

# v*-tag      -> buduje exe, tworzy GitHub Release, publikuje stronę (generator, katalog, update.json)
# push main   -> zmiany katalogu/strony: publikuje stronę z exe z ostatniego wydania (bez nowego wydania)
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['catalog/**', 'web/**', 'tools/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Wersja
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # MODE: tag    = push tagu v* -> build + nowe wydanie
          #       latest = push do main, wydanie istnieje -> exe z ostatniego wydania
          #       dev    = push do main, brak wydań -> build bez wydania, exe tylko na stronie
          $owner, $repo = $env:GITHUB_REPOSITORY.Split('/')
          $pagesExe = "https://$($owner.ToLower()).github.io/$repo/AppInstaller.exe"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $mode = 'tag'; $v = $env:GITHUB_REF_NAME.TrimStart('v')
            $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$v/AppInstaller.exe"
          } else {
            $tag = $null
            try { $tag = (gh release view --json tagName -q .tagName 2>$null) } catch { }
            if ($tag) {
              $mode = 'latest'; $v = $tag.Trim().TrimStart('v')
              $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$v/AppInstaller.exe"
            } else {
              $mode = 'dev'; $v = '0.0.1'; $url = $pagesExe
            }
          }
          Write-Host "Tryb: $mode, wersja: $v"
          "MODE=$mode"       >> $env:GITHUB_ENV
          "VERSION=$v"       >> $env:GITHUB_ENV
          "RELEASE_URL=$url" >> $env:GITHUB_ENV
          $global:LASTEXITCODE = 0   # 'gh release view' bez wydań zwraca 1 — to nie jest błąd
          exit 0

      - name: Klucz publiczny obecny
        shell: pwsh
        run: if (-not (Test-Path keys/public.xml)) { throw 'Brak keys/public.xml — uruchom tools/New-SigningKey.ps1 i zacommituj klucz publiczny.' }

      - name: Build
        if: env.MODE != 'latest'
        run: dotnet build src/AppInstaller/AppInstaller.csproj -c Release -p:Version=${{ env.VERSION }} -o out

      - name: Pobierz exe z ostatniego wydania
        if: env.MODE == 'latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$env:VERSION" --pattern AppInstaller.exe --dir out --clobber

      - name: GitHub Release
        if: env.MODE == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: out/AppInstaller.exe
          generate_release_notes: true

      - name: Złóż stronę (podpisy katalogu i update.json)
        shell: pwsh
        env:
          SIGNING_KEY_XML: ${{ secrets.SIGNING_KEY_XML }}
        run: ./tools/Build-Site.ps1 -Exe out/AppInstaller.exe -Version $env:VERSION -ReleaseUrl $env:RELEASE_URL -Out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
