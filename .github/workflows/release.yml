name: Build & publish

# v*-tag      -> buduje exe, tworzy GitHub Release, publikuje stronę (generator, katalog, update.json)
# push main   -> zmiany katalogu/strony: publikuje stronę z exe z ostatniego wydania (bez nowego wydania)
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['catalog/**', 'web/**', 'tools/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Wersja
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v'); $release = $true
          } else {
            $tag = gh release view --json tagName -q .tagName 2>$null
            if ($LASTEXITCODE -eq 0 -and $tag) { $v = $tag.TrimStart('v'); $release = $false }
            else { $v = '0.0.1'; $release = $true }   # pierwsze uruchomienie bez wydań
          }
          "VERSION=$v"       >> $env:GITHUB_ENV
          "NEW_RELEASE=$release" >> $env:GITHUB_ENV
          "RELEASE_URL=https://github.com/${{ github.repository }}/releases/download/v$v/AppInstaller.exe" >> $env:GITHUB_ENV

      - name: Klucz publiczny obecny
        shell: pwsh
        run: if (-not (Test-Path keys/public.xml)) { throw 'Brak keys/public.xml — uruchom tools/New-SigningKey.ps1 i zacommituj klucz publiczny.' }

      - name: Build (nowe wydanie)
        if: env.NEW_RELEASE == 'True'
        run: dotnet build src/AppInstaller/AppInstaller.csproj -c Release -p:Version=${{ env.VERSION }} -o out

      - name: Pobierz exe z ostatniego wydania
        if: env.NEW_RELEASE == 'False'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$env:VERSION" --pattern AppInstaller.exe --dir out --clobber

      - name: GitHub Release
        if: env.NEW_RELEASE == 'True'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: out/AppInstaller.exe
          generate_release_notes: true

      - name: Złóż stronę (podpisy katalogu i update.json)
        shell: pwsh
        env:
          SIGNING_KEY_XML: ${{ secrets.SIGNING_KEY_XML }}
        run: ./tools/Build-Site.ps1 -Exe out/AppInstaller.exe -Version $env:VERSION -ReleaseUrl $env:RELEASE_URL -Out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
